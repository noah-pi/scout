name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # dist/ is committed so Load unpacked works from a clone; make sure it
      # matches what the pinned dependencies build.
      - run: npm run build && git diff --exit-code -- dist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
